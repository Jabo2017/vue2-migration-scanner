name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试（零依赖，不需要 install）
        run: node --test
      - name: 自检 —— 扫描自身，确保在干净的 Vue 3 代码上不误报
        run: node bin/cli.mjs tests/fixtures/legacy-project --quiet --json /tmp/self.json
      - name: 阈值门禁（示例：MDI 不得超过 100）
        run: node bin/cli.mjs tests/fixtures/legacy-project --max-mdi 100
